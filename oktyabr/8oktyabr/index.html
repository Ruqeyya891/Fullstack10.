<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
</head>

<body>
<style>
    .loginBtn {
            margin-top: 20px;
            padding: 5px 15px;
            font-size: 14px;
            background-color: #e669c4;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .password-box {
            margin-top: 20px;
        }
        .password-input {
            padding: 5px 10px;
            font-size: 14px;
        }
        .eye-btn {
            padding: 5px 10px;
            font-size: 14px;
            background-color: #e669c4;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>


    <form>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button class="loginBtn">Login</button>
    </form>


    <div class="password-box">
        <input class="password-input" type="password" placeholder="Şifrə daxil edin">
        <button class="eye-btn">
            👁️
        </button>
    </div>


    <script src="script.js"></script>
</body>

</html>
