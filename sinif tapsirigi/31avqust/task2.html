<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panaderia</title>

    <link rel="stylesheet" href="assets/css/task2.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body>


    <div class="top-bar">

        <div class="top-left">
            <i class="fa-solid fa-phone"></i>
            <span>CALL US 5555-00-444</span>
        </div>

        <div class="top-right">

            <a href="#">
                <i class="fa-regular fa-heart"></i>
                <span>ABOUT US</span>
            </a>

            <a href="#">
                <i class="fa-solid fa-globe"></i>
                <span>LOCATIONS</span>
            </a>

            <a href="#">
                <i class="fa-regular fa-file-lines"></i>
                <span>CAREERS</span>
            </a>

        </div>

    </div>

    <header class="header">

        <div class="header-icons">

            <div class="round-icon">
                <i class="fa-regular fa-rectangle-list"></i>
            </div>

            <div class="round-icon">
                <i class="fa-solid fa-globe"></i>
            </div>

        </div>
        <div class="logo">

            <img src="https://panaderia.qodeinteractive.com/wp-content/uploads/2019/03/logo-light.png"
                alt="Panaderia Logo">

        </div>
        <div class="header-icons">

            <div class="round-icon">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>

            <div class="round-icon cart">

                <i class="fa-solid fa-basket-shopping"></i>

                <span>0</span>

            </div>

        </div>

    </header>

    <nav class="navbar">

        <a href="#" class="active">HOME</a>
        <a href="#">PAGES</a>
        <a href="#">BLOG</a>
        <a href="#">PORTFOLIO</a>
        <a href="#">SHOP</a>
        <a href="#" class="elements">
            ELEMENTS
            <sup>★</sup>
        </a>
    </nav>

    <section class="gallery">
        <div class="gallery-item">
            <img src="https://panaderia.qodeinteractive.com/wp-content/uploads/2019/03/masonry-gallery-1-1.jpg"
                alt="Bakery interior">

        </div>
        <div class="gallery-item">

            <img src="https://panaderia.qodeinteractive.com/wp-content/uploads/2019/03/masonry-gallery-2.jpg"
                alt="Croissants">

        </div>

        <div class="gallery-item large">
            <img src="https://panaderia.qodeinteractive.com/wp-content/uploads/2019/03/masonry-gallery-4.jpg"
                alt="Sandwich">

        </div>

        <div class="special-box">

            <span>DON'T MISS</span>
            <h2>
                TODAY'S SPECIAL BAKED<br>
                FOR YOU.
            </h2>

            <a href="#">
                READ MORE
            </a>

        </div>

        <div class="gallery-item">

            <img src="https://panaderia.qodeinteractive.com/wp-content/uploads/2019/03/masonry-gallery-3.jpg"
                alt="Bread">

        </div>

    </section>


    <div class="slider-navigation">
        <a href="#" class="prev">
            <span>PREV</span>
            <strong>⟵</strong>
        </a>

        <a href="#" class="next">

            <span>NEXT</span>

            <strong>⟶</strong>

        </a>

    </div>


    <section class="testimonial">

        <div class="stars">

            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>

        </div>


        <h2>
            "Everyone has a favourite cake, pastry, pudding or pie<br>
            from when they were kids."
        </h2>


        <p class="author">
            TOM TALLY
        </p>


        <div class="dots">

            <span class="active-dot"></span>
            <span></span>
            <span></span>

        </div>

    </section>

</body>

</html>
